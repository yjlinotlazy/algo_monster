<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLE Monster — Interview Prep</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><h1>MLE Monster</h1><p>Interview question practice</p></div>
        <nav id="category-nav" class="category-nav" aria-label="Categories"></nav>
        <nav id="question-list" class="question-list" aria-label="Questions"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p id="category" class="category">Select a question</p>
            <h2 id="title">MLE Monster</h2>
          </div>
          <div class="actions">
            <label class="status-control"><span>Status</span><select id="learning-status"><option value="to learn">to learn</option><option value="learning">learning</option><option value="learned">learned</option></select></label>
            <button id="reset-btn" type="button">Reset</button>
          </div>
        </header>

        <section class="question-body">
          <p id="question-text" class="question-text"></p>
          <textarea id="answer-input" placeholder="Write your answer here..." spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
          <button id="grade-btn" type="button" class="primary">Grade me</button>
        </section>

        <section id="grading-result" class="grading-result empty">Grading results will appear here.</section>
        <section id="reference-answer" class="reference-answer hidden"><h3>Interview Answer</h3><div id="reference-text"></div></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
